plugins {

    id 'java'

    id 'org.springframework.boot' version '3.2.2'

    id 'io.spring.dependency-management' version '1.1.3'

    id 'jacoco'

}

import java.util.Properties

def env = new Properties()
file(".env").withInputStream {
    env.load(it)
}

bootRun {
    environment env
}

group = 'com.example.demo'

version = '0.0.1-SNAPSHOT'


java {

    sourceCompatibility = '21'

    targetCompatibility = '21'

}



repositories {

    mavenCentral()

}



configurations {

    compileOnly {

        extendsFrom annotationProcessor

    }

}



dependencies {


    /*
     * Spring Web REST API
     */
    implementation 'org.springframework.boot:spring-boot-starter-web'



    /*
     * Spring Data JPA
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'



    /*
     * Validation Jakarta (@Valid, @NotBlank...)
     */
    implementation 'org.springframework.boot:spring-boot-starter-validation'



    /*
     * PostgreSQL Driver
     */
    runtimeOnly 'org.postgresql:postgresql'



    /*
     * Flyway migration
     */
    implementation 'org.flywaydb:flyway-core:10.7.2'
    implementation 'org.flywaydb:flyway-database-postgresql:10.7.2'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.2'
    implementation 'org.eclipse.angus:angus-mail:2.0.3'

    /*
     * Lombok
     */
    compileOnly 'org.projectlombok:lombok:1.18.30'

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    runtimeOnly 'org.postgresql:postgresql'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'

    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'



    /*
     * Jackson Java Time (Instant, LocalDateTime...)
     */
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'



    /*
     * Tests
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testImplementation 'org.testcontainers:testcontainers'

    testImplementation 'org.testcontainers:junit-jupiter'

}



test {

    useJUnitPlatform()

    finalizedBy jacocoTestReport

}



jacoco {

    toolVersion = "0.8.11"

}



jacocoTestReport {


    dependsOn test


    reports {

        xml.required = true

        html.required = true

    }


}



jacocoTestCoverageVerification {


    dependsOn test


    violationRules {

        rule {

            limit {

                counter = "LINE"

                minimum = 0.0

            }

        }

    }

}