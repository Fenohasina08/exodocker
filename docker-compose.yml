services:
  postgres:
    image: postgres:16-alpine
    container_name: exodocker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exodocker
      POSTGRES_USER: exodocker
      POSTGRES_PASSWORD: exodocker
    ports:
      - "5432:5432"
    volumes:
      - exodocker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exodocker -d exodocker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  exodocker-pgdata:
